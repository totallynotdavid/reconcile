[tools]
bun = "1.4.3"
node = "24.22.0"

[tasks.install]
description = "Install dependencies from bun.lock"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Check code, Markdown, YAML and JSON without writing"
run = ["bunx oxlint --deny-warnings", "bunx oxfmt --check"]

[tasks.fix]
description = "Apply safe lint fixes and format code, Markdown, YAML and JSON"
run = ["bunx oxlint --fix", "bunx oxfmt"]

[tasks.typecheck]
description = "Type-check the app and its tests"
run = "bunx tsc --noEmit"

[tasks.test]
description = "Run the unit and route tests"
run = "bunx vitest run"

[tasks.build]
description = "Build the Next.js app"
run = "bunx next build"

[tasks.check]
description = "Run every check, as CI does"
depends = ["lint", "typecheck", "test", "build"]

[tasks.dev]
description = "Start the dev server on http://localhost:3000"
run = "bunx next dev"

[tasks.start]
description = "Serve the production build"
run = "bunx next start"
